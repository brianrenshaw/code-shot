name: CodeShot
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CodeShot:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    info:
      path: CodeShot/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        SUFeedURL: https://github.com/brianrenshaw/code-shot/releases/latest/download/appcast.xml
        SUPublicEDKey: A8MAV7/u4f2SYkkiCP1iz0UkEXN76Y78rVJzMQeDLjA=
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    sources:
      - CodeShot
      - path: LICENSE
        buildPhase: resources
    settings:
      PRODUCT_NAME: CodeShot
      PRODUCT_BUNDLE_IDENTIFIER: com.brianrenshaw.CodeShot
      ENABLE_HARDENED_RUNTIME: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "0.1.5"
      CURRENT_PROJECT_VERSION: "13"
  CodeShotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - CodeShot/Shortcuts.swift
      - CodeShot/CaptureModel.swift
      - CodeShot/CaptureNote.swift
      - CodeShot/ScrollStitcher.swift
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.brianrenshaw.CodeShotTests
schemes:
  CodeShot:
    build:
      targets:
        CodeShot: all
    test:
      targets: [CodeShotTests]
